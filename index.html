<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Arcade Academy — pick a game and start learning.">
  <title>Arcade Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="shared/css/global.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site-shell">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow"><span aria-hidden="true">✦</span> Learning, levelled up</p>
      <h1 id="page-title">Arcade <span>Academy</span></h1>
      <p class="hero-copy">Choose a challenge, test what you know, and make every lesson a high score.</p>
      <a class="jump-link" href="#games">Explore games <span aria-hidden="true">↓</span></a>
      <div class="hero-orb orb-one" aria-hidden="true">✦</div>
      <div class="hero-orb orb-two" aria-hidden="true">★</div>
      <div class="hero-grid" aria-hidden="true"></div>
    </section>

    <section class="dashboard-section" id="dashboard" aria-labelledby="dashboard-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Player stats</p>
          <h2 id="dashboard-title">Your Progress</h2>
        </div>
      </div>
      <div class="stat-grid" id="stat-grid"></div>
    </section>

    <section class="game-section" id="games" aria-labelledby="games-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Game library</p>
          <h2 id="games-title">Pick your next quest</h2>
        </div>
        <p class="game-count" id="game-count" aria-live="polite"></p>
      </div>
      <div class="game-grid" id="game-grid"></div>
    </section>
  </main>

  <template id="stat-card-template">
  <div class="stat-card">
    <span class="stat-icon" aria-hidden="true"></span>
    <div class="stat-info">
      <p class="stat-value"></p>
      <p class="stat-label"></p>
    </div>
  </div>
</template>

  <template id="game-card-template">
  <a class="game-card" href="#">
    <div class="game-art" aria-hidden="true">
      <span class="game-icon"></span>
      <span class="spark spark-a">✦</span>
      <span class="spark spark-b">✦</span>
    </div>

    <div class="game-details">

      <h3 class="game-title"></h3>
      <p class="game-catchphrase"></p>
      <p class="game-description"></p>
      <p class="game-genre"></p>

      <dl class="game-stats">
        <div class="stat-row">
          <dt>High Score</dt>
          <dd class="stat-highscore"></dd>
        </div>
        <div class="stat-row">
          <dt>Accuracy</dt>
          <dd class="stat-accuracy"></dd>
        </div>
        <div class="stat-row">
          <dt>Questions</dt>
          <dd class="stat-questions"></dd>
        </div>
        <div class="stat-row">
          <dt>Play Time</dt>
          <dd class="stat-playtime"></dd>
        </div>
        <div class="stat-row">
          <dt>Last Played</dt>
          <dd class="stat-lastplayed"></dd>
        </div>
      </dl>

      <span class="play-button">
        Play now
        <span aria-hidden="true">→</span>
      </span>

    </div>
  </a>
</template>

  <script src="shared/js/PlatformManager.js"></script>
  <script src="app.js"></script>
</body>
</html>
