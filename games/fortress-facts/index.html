<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortress Facts</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/css/global.css">
  <link rel="stylesheet" href="style.css">
 </head>
 <body>
  <div class="hud" role="status" aria-live="polite">
   <div class="hud-left">
    <span id="hud-hp">❤️ HP: 100/100</span> <span id="hud-ammo">🏹 Ammo: 3/10</span>
   </div>
   <div class="hud-right">
    <span id="hud-gold">🪙 Coins: 0</span> <button id="cashout-btn" style="display:none;margin-left:6px;font-size:11px;padding:3px 9px;border-radius:6px;border:1px solid #ffcc44;background:rgba(255,204,68,0.15);color:#ffcc44;cursor:pointer;font-family:'Lexend',sans-serif;vertical-align:middle" aria-label="Coins are maxed out — end this run early and bank your coins">💰 Coins Maxed — Cash Out</button> <span id="hud-wave">⭐ Wave: 1</span> <span id="hud-bank" style="color:#00d4ff">📚 Loading...</span> <span id="hud-weather" style="color:#ffcc44"></span>
   </div>
  </div><button class="ammo-btn" id="ammo-btn" aria-label="Get ammo by answering a question">🏹 Get Ammo (Q)</button>
  <button class="target-btn" id="target-btn" aria-label="Cycle tower targeting mode">🎯 Targeting: Nearest</button>
  <canvas id="game"></canvas>
  <div id="modal-root"></div>
  <div id="screenWipe" aria-hidden="true"></div>
  <script src="gameconfig.js"></script>
  <script src="../../shared/js/PlatformManager.js?v=20260812-challenge-mode-v2"></script>
  <script src="../../shared/js/QuestionManager.js"></script>
  <script src="game.js"></script>
 </body>
</html>
